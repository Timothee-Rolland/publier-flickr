# Construit l'app autonome (Python embarqué) et l'attache à chaque release GitHub.
# Lien de téléchargement stable :
#   https://github.com/Timothee-Rolland/publier-flickr/releases/latest/download/Publier-sur-Flickr.zip
name: Zip autonome
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: scripts/construire_zip_autonome.sh
      - name: Contrôle des secrets
        run: |
          unzip -q "dist/Publier sur Flickr.zip" -d /tmp/verif
          grep -q COLLER "/tmp/verif/Publier sur Flickr.app/Contents/Resources/config.ini"
      - name: Attacher à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [ -n "$TAG" ] || TAG="$(gh release view --json tagName -q .tagName)"
          mv "dist/Publier sur Flickr.zip" dist/Publier-sur-Flickr.zip
          gh release upload "$TAG" dist/Publier-sur-Flickr.zip --clobber

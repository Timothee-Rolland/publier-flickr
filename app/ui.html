<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Publier sur Flickr</title>
<style>
:root{
  --bg:#f5f5f7; --carte:#fff; --texte:#1d1d1f; --doux:#6e6e73; --bord:#e3e3e8;
  --accent:#2f6fde; --accent-doux:#e8f0fd; --ok:#1f9d55; --ok-doux:#e5f6ec;
  --nouveau:#c2610c; --nouveau-doux:#fdf0e3; --erreur:#d33a2c; --rayon:12px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1c1c1e; --carte:#2c2c2e; --texte:#f2f2f7; --doux:#a1a1a6; --bord:#3a3a3c;
  --accent:#5b95f5; --accent-doux:#24324a; --ok:#3fc27a; --ok-doux:#1f3a2b;
  --nouveau:#f0a04b; --nouveau-doux:#3d2c1a;}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--texte);display:flex;flex-direction:column;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
header{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--bord);background:var(--carte)}
header h1{font-size:16px;margin:0;font-weight:600;flex:1}
.logo{width:30px;height:30px}
.compte{font-size:13px;color:var(--doux);display:flex;align-items:center;gap:8px}
.pastille{width:8px;height:8px;border-radius:50%;background:var(--doux)}
.pastille.on{background:var(--ok)}
main{flex:1;overflow:auto;padding:22px}
footer{padding:14px 22px;border-top:1px solid var(--bord);background:var(--carte);display:flex;align-items:center;gap:14px}
footer .resume{flex:1;color:var(--doux)}
button{font:inherit;border:1px solid var(--bord);background:var(--carte);color:var(--texte);
  padding:7px 14px;border-radius:8px;cursor:pointer}
button:hover{border-color:var(--doux)}
button.primaire{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.primaire:disabled{opacity:.45;cursor:default}
button.lien{border:none;background:none;color:var(--accent);padding:0}
.accueil{display:flex;flex-direction:column;gap:16px;height:100%}
.depot{border:2px dashed var(--bord);border-radius:18px;flex:1;min-height:300px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;color:var(--doux);text-align:center;transition:.15s}
.depot.survol{border-color:var(--accent);background:var(--accent-doux);color:var(--accent)}
.depot .grand{font-size:20px;font-weight:600;color:var(--texte)}
.depot svg{opacity:.5}
.barre{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.barre h2{margin:0;font-size:18px;flex:1}
.bloc{background:var(--carte);border:1px solid var(--bord);border-radius:var(--rayon);padding:16px 18px;margin-bottom:14px}
.bloc h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--doux);font-weight:600}
.album{display:grid;grid-template-columns:120px 1fr;gap:18px}
.album.exclu{opacity:.45}
.vignettes{display:grid;grid-template-columns:1fr 1fr;gap:4px;align-content:start;position:relative;cursor:pointer;border-radius:8px;width:120px}
.vignettes div[data-v]{width:58px;height:58px;border-radius:6px;background:var(--bg) center/cover no-repeat}
.vignettes .voir{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;border-radius:8px;
  background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:600;text-align:center;opacity:0;transition:opacity .15s;padding:6px}
.vignettes:hover .voir{opacity:1}
.galerie{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.g-tete{display:flex;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--bord);background:var(--carte)}
.g-titre{flex:1;display:flex;flex-direction:column}
.g-titre span{font-size:12px;color:var(--doux)}
.g-info{margin:14px 22px 0;padding:9px 12px;border-radius:8px;background:var(--ok-doux);color:var(--ok);font-size:13px}
.g-grille{flex:1;overflow:auto;padding:16px 22px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.tuile{position:relative;height:160px;min-width:90px;flex:0 0 auto;border-radius:8px;overflow:hidden;background:var(--bord);
  box-shadow:0 0 0 3px var(--accent);cursor:zoom-in;transition:opacity .12s, box-shadow .12s}
.tuile img{height:160px;width:auto;display:block}
.tuile .vide{width:140px;height:160px}
.tuile .nom{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;padding:14px 8px 5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transition:opacity .12s}
.tuile:hover .nom{opacity:1}
.tuile .coche{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:var(--accent);border:2px solid #fff;
  color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.tuile .coche::after{content:"✓"}
.tuile .coche:hover{transform:scale(1.1)}
.tuile.non{box-shadow:none;opacity:.5}
.tuile.non:hover{opacity:.8}
.tuile.non .coche{background:rgba(0,0,0,.25)}
.tuile.non .coche::after{content:""}
.tuile.deja{box-shadow:none}
.tuile .badge{position:absolute;left:6px;top:6px;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:rgba(0,0,0,.6);color:#fff}
.tuile .badge.ok{background:var(--ok)}
.tuile .badge + .badge{top:28px}
.g-aide{font-size:12px;color:var(--doux);padding:0 22px 12px}
.surv{background:var(--carte);border:1px solid var(--bord);border-radius:var(--rayon);padding:14px 18px}
.surv-tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.surv-tete .t{flex:1;font-size:13px}
.surv-tete code{font:12px ui-monospace,Menlo,monospace;background:var(--bg);padding:2px 6px;border-radius:5px}
.attente{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--bord)}
.attente:first-of-type{margin-top:10px}
.attente .n{flex:1} .attente .n small{color:var(--doux)}
.bloque{margin-top:10px;background:#fdecea;color:var(--erreur);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.5}
@media (prefers-color-scheme: dark){.bloque{background:#3d1f1c}}
.bloque ol{margin:6px 0 8px 18px;padding:0}
.bloque .actions{display:flex;gap:8px;flex-wrap:wrap}
.banniere{position:sticky;top:-22px;z-index:20;margin:-22px -22px 16px;padding:10px 22px;background:var(--accent);color:#fff;
  display:flex;align-items:center;gap:12px;font-size:13px}
.banniere span{flex:1}
.banniere button{background:rgba(255,255,255,.2);color:#fff;border-color:transparent}
.aide{font-size:12px;color:var(--doux);margin:-6px 0 10px 98px;line-height:1.4}
.aide.haut{margin:8px 0 0 0}
.aide b{color:var(--texte);font-weight:600}
.invalide,.invalide:focus{border-color:var(--erreur)!important;box-shadow:0 0 0 1px var(--erreur)}
.aide.err{color:var(--erreur)}
.commune-z{position:relative;flex:1;min-width:200px;max-width:340px}
.commune-z input{width:100%}
.commune-z .ok{position:absolute;right:9px;top:8px;color:var(--ok);font-size:13px;pointer-events:none}
input[type=date]{font:inherit;color:var(--texte);background:var(--bg);border:1px solid var(--bord);border-radius:8px;padding:6px 10px}
.loupe{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(12,12,14,.97);display:flex;flex-direction:column;color:#fff}
.loupe .l-tete{display:flex;align-items:center;gap:12px;padding:12px 18px}
.loupe .l-tete span{flex:1;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loupe button{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.loupe button:hover{background:rgba(255,255,255,.22)}
.loupe .l-image{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 70px;position:relative}
.loupe .l-image img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.loupe .nav{position:absolute;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;font-size:24px;padding:0}
.loupe .prec{left:10px} .loupe .suiv{right:10px}
.loupe .l-pied{display:flex;justify-content:center;gap:12px;padding:14px}
.loupe .l-pied label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;background:rgba(255,255,255,.12);padding:8px 14px;border-radius:8px}
.loupe .chargement{opacity:.6;font-size:13px}
.ligne{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ligne label{font-size:12px;color:var(--doux);width:88px;flex:none}
.ligne > input,.ligne > textarea{flex:1;min-width:180px}
input[type=text],input[type=password],textarea{font:inherit;color:var(--texte);background:var(--bg);border:1px solid var(--bord);border-radius:8px;padding:7px 10px;outline:none}
input[type=text]:focus,input[type=password]:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:34px;height:34px}
input.titre{font-size:16px;font-weight:600}
.meta{font-size:12px;color:var(--doux);margin:-4px 0 10px}
.meta b{color:var(--ok);font-weight:500}
.segment{display:inline-flex;border:1px solid var(--bord);border-radius:8px;overflow:hidden}
.segment button{border:none;border-radius:0;padding:6px 14px}
.segment button.actif{background:var(--accent);color:#fff}
.tags{flex:1;min-width:220px;position:relative;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:var(--bg);border:1px solid var(--bord);border-radius:8px;padding:5px 6px}
.tags:focus-within{border-color:var(--accent)}
.tags input{border:none!important;background:none!important;padding:3px 4px!important;flex:1;min-width:120px}
.puce{display:inline-flex;align-items:center;gap:5px;padding:2px 4px 2px 9px;border-radius:20px;font-size:13px;
  background:var(--accent-doux);color:var(--accent)}
.puce.nouveau{background:var(--nouveau-doux);color:var(--nouveau)}
.puce small{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.puce .x{cursor:pointer;width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;opacity:.7}
.puce .x:hover{opacity:1;background:rgba(0,0,0,.08)}
.puce .suggere{cursor:pointer;text-decoration:underline;font-size:12px}
.menu{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--carte);border:1px solid var(--bord);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:10;max-height:240px;overflow:auto;padding:4px}
.menu div{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.menu div.sel,.menu div:hover{background:var(--accent-doux)}
.menu span.n{color:var(--doux);font-size:12px}
.menu .creer{color:var(--nouveau)}
.rapides{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rapides button{font-size:12px;padding:3px 10px;border-radius:20px}
.avert{font-size:12px;background:var(--nouveau-doux);color:var(--nouveau);border-radius:8px;padding:7px 10px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.avert select{font:inherit;font-size:12px}
.avert.err-flickr{background:#fdecea;color:var(--erreur);display:block;line-height:1.5}
@media (prefers-color-scheme: dark){.avert.err-flickr{background:#3d1f1c}}
.tuile.lourd{box-shadow:none;opacity:.55;cursor:zoom-in}
.tuile .badge.err{background:var(--erreur)}
select.cible{font:inherit;flex:1;min-width:220px;max-width:520px;padding:6px 8px;border:1px solid var(--bord);border-radius:8px;background:var(--bg);color:var(--texte)}
.progres{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:6px}
.progres div{height:100%;background:var(--accent);width:0;transition:width .3s}
.statut{font-size:12px;color:var(--doux);margin-top:6px}
.statut.ok{color:var(--ok)} .statut.err{color:var(--erreur)}
.journal{font-size:12px;color:var(--erreur);margin-top:4px;max-height:80px;overflow:auto;-webkit-user-select:text;user-select:text}
.cle{max-width:520px;margin:40px auto}
.cle p{color:var(--doux)}
.cle input{width:100%;margin-bottom:10px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--texte);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none}
.toast.vu{opacity:.95}
.case{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--doux)}
</style>
</head>
<body>
<header>
  <img class="logo" src="icone.png" alt="">
  <h1>Publier sur Flickr</h1>
  <div class="compte"><span class="pastille" id="pastille"></span><span id="compte">Non connecté</span>
    <button id="btnConnexion" style="display:none">Se connecter</button>
    <button id="btnReglages" title="Réglages (clé Flickr)" style="padding:5px 9px">⚙︎</button></div>
</header>
<main id="main"></main>
<footer id="pied" style="display:none">
  <div class="resume" id="resume"></div>
  <button id="btnArret" style="display:none">Arrêter</button>
  <button class="primaire" id="btnPublier">Publier</button>
</footer>
<div class="toast" id="toast"></div>

<script>
window.addEventListener("error", e=>{ try{ pywebview.api.journal(`${e.message} (ligne ${e.lineno})`) }catch(_){}
  const t=document.getElementById("toast"); if(t){t.textContent="Erreur : "+e.message;t.classList.add("vu")} });
const S = {limites:{photo:200*1024**2, video:1024**3, duree:0}, etat:null, moi:null, tags:[], index:new Map(), albumsFlickr:[], analyse:null,
           albums:[], commun:[], enCours:false};
const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cle = t => String(t ?? "").toLowerCase().split("").filter(c => /[\p{L}\p{N}]/u.test(c)).join("");
const sansAcc = t => String(t ?? "").normalize("NFD").replace(/\p{M}/gu, "");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("vu");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("vu"),3500)}
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];
  d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]==b[j-1]?0:1));p=t}}return d[b.length]}

/* ---------- tags ---------- */
function infoTag(t){
  const k = cle(t);
  if (S.index.has(k)) return {existe:true};
  const ka = sansAcc(k);
  let best=null, bd=9;
  for (const x of S.tags){ const kx=sansAcc(x.cle); let d = kx===ka?0:(ka.length>4?lev(ka,kx):9);
    if(d<bd){bd=d;best=x} }
  return {existe:false, proche: bd<=1 ? best.tag : null};
}
function suggestions(q, deja){
  const k = sansAcc(cle(q)); if(!k) return S.tags.filter(t=>!deja.has(t.cle)).slice(0,8);
  return S.tags.filter(t=>!deja.has(t.cle) && sansAcc(t.cle).includes(k))
    .sort((a,b)=>(sansAcc(b.cle).startsWith(k)-sansAcc(a.cle).startsWith(k))||b.nb-a.nb).slice(0,8);
}
/* Champ de tags réutilisable : liste = tableau modifié sur place */
function champTags(conteneur, liste, surChange){
  let sel = 0, ouvert=false;
  function rendre(){
    conteneur.innerHTML = liste.map((t,i)=>{
      const inf = S.tags.length ? infoTag(t) : {existe:true};
      return `<span class="puce ${inf.existe?"":"nouveau"}" title="${inf.existe?"Tag déjà utilisé sur le compte":"Nouveau tag"}">
        ${esc(t)} ${inf.existe?"":"<small>nouveau</small>"}
        ${inf.proche?`<span class="suggere" data-i="${i}" data-p="${esc(inf.proche)}">→ ${esc(inf.proche)} ?</span>`:""}
        <span class="x" data-i="${i}">✕</span></span>`}).join("") +
      `<input type="text" placeholder="${liste.length?"":"Ajouter des tags…"}">`;
    const inp = conteneur.querySelector("input");
    inp.addEventListener("input", ()=>{sel=0;menu(inp)});
    inp.addEventListener("focus", ()=>menu(inp));
    inp.addEventListener("blur", ()=>setTimeout(fermer,150));
    inp.addEventListener("keydown", e=>{
      const m = conteneur.querySelector(".menu"), items = m?[...m.children]:[];
      if(e.key==="ArrowDown"&&items.length){sel=(sel+1)%items.length;menu(inp);e.preventDefault()}
      else if(e.key==="ArrowUp"&&items.length){sel=(sel-1+items.length)%items.length;menu(inp);e.preventDefault()}
      else if(e.key==="Enter"||e.key===","||e.key==="Tab"&&inp.value.trim()){
        e.preventDefault(); const it=items[sel];
        ajouter(it&&it.dataset.t!==undefined?it.dataset.t:inp.value);}
      else if(e.key==="Backspace"&&!inp.value&&liste.length){liste.pop();changer(true)}
      else if(e.key==="Escape"){fermer()}
    });
    conteneur.querySelectorAll(".x").forEach(x=>x.onclick=()=>{liste.splice(+x.dataset.i,1);changer(true)});
    conteneur.querySelectorAll(".suggere").forEach(x=>x.onclick=()=>{liste[+x.dataset.i]=x.dataset.p;changer(true)});
    conteneur.onclick = e=>{ if(e.target===conteneur) inp.focus() };
  }
  function fermer(){const m=conteneur.querySelector(".menu");if(m)m.remove();ouvert=false}
  function menu(inp){
    fermer(); const q=inp.value.replace(/,/g,"").trim();
    const deja=new Set(liste.map(cle)); const s=suggestions(q,deja);
    const items = s.map(t=>`<div data-t="${esc(t.tag)}"><span>${esc(t.tag)}</span><span class="n">${t.nb?t.nb+" photos":""}</span></div>`);
    if(q && !S.index.has(cle(q)) && !deja.has(cle(q))) items.push(`<div data-t="${esc(q)}" class="creer"><span>Créer « ${esc(q)} »</span><span class="n">nouveau</span></div>`);
    if(!items.length) return;
    const m=document.createElement("div"); m.className="menu"; m.innerHTML=items.join("");
    [...m.children].forEach((d,i)=>{ if(i===sel%items.length) d.classList.add("sel");
      d.onmousedown=e=>{e.preventDefault();ajouter(d.dataset.t)} });
    conteneur.appendChild(m); ouvert=true;
  }
  function ajouter(v){
    v=v.replace(/,/g,"").trim(); if(!v) return;
    const ex=S.tags.find(t=>t.cle===cle(v)); if(ex) v=ex.tag;   // garder l'écriture existante
    if(!liste.some(t=>cle(t)===cle(v))) liste.push(v);
    sel=0; changer(true);
  }
  function changer(focus){rendre(); surChange&&surChange(); if(focus) conteneur.querySelector("input").focus()}
  conteneur.classList.add("tags"); conteneur._rendre=rendre; rendre();
}

/* ---------- écrans ---------- */
async function rendreReglagesSurv(r){
  r = r || await pywebview.api.reglages();
  const z=$("#reglagesSurv"); if(!z) return;
  z.innerHTML=`<h3>Dossier surveillé</h3>
    <p>Les dossiers de photos déposés ici sont détectés automatiquement et proposés à l'import.</p>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
      <code style="flex:1;font:12px ui-monospace,Menlo,monospace;background:var(--bg);padding:7px 9px;border-radius:7px">${esc(r.lisible)}</code>
      <button id="rsChoisir">Choisir…</button><button id="rsOuvrir">Ouvrir</button></div>
    ${r.acces==="bloque"?`<div class="bloque">macOS bloque l'accès à ce dossier : voir l'écran d'accueil pour l'autoriser, ou choisissez un dossier hors Bureau/Documents/Téléchargements/Images.</div>`:""}
    <label class="case" style="font-size:13px;color:var(--texte);margin-top:10px">
      <input type="checkbox" id="rsDemarrage" ${r.demarrage?"checked":""} ${r.app?"":"disabled"}>
      Ouvrir au démarrage du Mac, en arrière-plan (l'icône reste dans la barre des menus)</label>
    <p style="font-size:12px;margin-top:10px">${r.barre
      ? "✓ Icône visible dans la barre des menus : fermer la fenêtre retire l'app du Dock, elle continue de surveiller en haut de l'écran."
      : "⚠ L'icône n'est pas visible dans la barre des menus (souvent cachée par l'encoche ou faute de place) : fermer la fenêtre garde l'app dans le Dock. Libérez de la place dans la barre des menus puis relancez l'app."}</p>`;
  $("#rsChoisir").onclick=async()=>rendreReglagesSurv(await pywebview.api.choisir_dossier_surveille());
  $("#rsOuvrir").onclick=()=>pywebview.api.ouvrir_dossier_surveille();

function surAnalyse(r){
  if(S.enCours) return toast("Publication en cours : attendez la fin");
  if(!r.albums.length){ toast("Aucune photo trouvée dans « "+r.nom+" »"); return; }
  S.termine=false;
  const lourds=r.albums.flatMap(a=>a.fichiers).filter(tropLourd);
  if(lourds.length) setTimeout(()=>toast(`⚠ ${lourds.length} fichier${lourds.length>1?"s":""} trop lourd${lourds.length>1?"s":""} pour Flickr : ${lourds.length>1?"ils seront ignorés":"il sera ignoré"}`),400);
  S.analyse=r;
  const plusieurs = r.albums.length>1;
  // un seul album : pas de « tags pour tous », les tags par défaut vont directement dans l'album
  S.commun = plusieurs ? [...S.etat.tags_defaut] : [];
  const communs=new Set(S.commun.map(cle));
  const fusion=t=>{const vus=new Set(); return t.filter(x=>!vus.has(cle(x))&&vus.add(cle(x)))};
  S.albums = r.albums.map(a=>({...a, inclus:true,
      tags: plusieurs ? a.tags.filter(t=>!communs.has(cle(t))) : fusion([...S.etat.tags_defaut, ...a.tags]),
      public: a.public===null||a.public===undefined ? S.etat.public_defaut : a.public, cible:null, exclus:new Set()}));
  rendreAlbums();
}

/* ---------- titre + date ---------- */
function titreFlickr(a){
  const t=(a.titre||"").trim(); if(!a.date) return t;
  const [y,m,j]=a.date.split("-"); return `${t} - ${j}.${m}.${y.slice(2)}`;
}
function decouperTitre(t){
  const m=/\s+-\s+(\d{2})\.(\d{2})\.(\d{2})$/.exec(t||"");
  return m ? [t.slice(0,m.index).trim(), `20${m[3]}-${m[2]}-${m[1]}`] : [(t||"").trim(), ""];
}
/* ---------- commune : uniquement une commune du référentiel officiel ---------- */
function champCommune(zone, a){
  const inp=zone.querySelector("input"); let minuterie=null, res=[], sel=0, demande=0;
  function fermer(){ const m=zone.querySelector(".menu"); if(m) m.remove(); }
  function afficher(){
    fermer(); if(!res.length) return;
    const m=document.createElement("div"); m.className="menu";
    m.innerHTML=res.map((c,k)=>`<div data-k="${k}" class="${k===sel?"sel":""}"><span>${esc(c.nom)} <span class="n">(${esc(c.dep)})</span></span><span class="n">${esc(c.cp)}</span></div>`).join("");
    [...m.children].forEach(el=>el.onmousedown=e=>{e.preventDefault(); choisir(res[+el.dataset.k])});
    zone.appendChild(m);
  }
  function choisir(c){
    a.commune=c; inp.value=`${c.nom} (${c.dep})`; inp.classList.remove("invalide"); fermer();
    let ok=zone.querySelector(".ok"); if(!ok){ ok=document.createElement("span"); ok.className="ok"; ok.textContent="✓"; zone.appendChild(ok); }
  }
  inp.addEventListener("input",()=>{
    a.commune=null; const ok=zone.querySelector(".ok"); if(ok) ok.remove();
    clearTimeout(minuterie); const q=inp.value.trim();
    if(q.length<2){ res=[]; fermer(); return; }
    minuterie=setTimeout(async()=>{
      const n=++demande; const r=await pywebview.api.chercher_communes(q);
      if(n!==demande) return;
      if(r===null){ res=[]; fermer(); toast("Recherche de communes indisponible (connexion ?)"); return; }
      res=r; sel=0; afficher();
    },250);
  });
  inp.addEventListener("keydown",e=>{
    if(!res.length) return;
    if(e.key==="ArrowDown"){ sel=(sel+1)%res.length; afficher(); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ sel=(sel-1+res.length)%res.length; afficher(); e.preventDefault(); }
    else if(e.key==="Enter"){ e.preventDefault(); choisir(res[sel]); }
    else if(e.key==="Escape") fermer();
  });
  inp.addEventListener("blur",()=>setTimeout(()=>{
    fermer();
    if(!a.commune && inp.value.trim()) inp.classList.add("invalide");   // texte libre refusé
  },150));
}

/* ---------- galerie : choisir les fichiers à envoyer ---------- */
function aEnvoyer(a){ return a.fichiers.filter(f=>!f.deja && !tropLourd(f) && !a.exclus.has(f.nom)).length; }
/* ---------- limites de Flickr (taille par fichier) ---------- */
function maxPour(f){ return f.video ? S.limites.video : S.limites.photo; }
function tropLourd(f){ return !f.deja && f.taille > maxPour(f); }
function taille(o){ const u=["o","Ko","Mo","Go","To"]; let i=0; while(o>=1024&&i<4){o/=1024;i++}
  return (i<2?Math.round(o):Math.round(o*10)/10).toString().replace(".",",")+" "+u[i]; }
function surLimites(l){ S.limites=l; if(S.analyse && !S.enCours){ rendreListe(); resume(); } }
const fileApercus=[]; let apercusEnCours=0;
function chargerApercu(chemin, taille, rappel){ fileApercus.push([chemin,taille,rappel]); pomperApercus(); }
function pomperApercus(){
  while(apercusEnCours<6 && fileApercus.length){
    const [chemin,taille,rappel]=fileApercus.shift();
    apercusEnCours++;
    pywebview.api.apercu(chemin,taille).then(u=>rappel(u)).catch(()=>rappel(null))
      .finally(()=>{ apercusEnCours--; pomperApercus(); });
  }
}
function ouvrirGalerie(i){

    ${dispo?"":`<div class="g-info">✓ Tous les fichiers de cet album sont déjà sur Flickr : il n'y a rien de nouveau à envoyer.</div>`}
    <div class="g-grille">${a.fichiers.map((f,j)=>`
      <div class="tuile ${f.deja?"deja":""} ${tropLourd(f)?"lourd":""}" data-j="${j}">
        <div class="vide"></div>
        ${f.deja?`<span class="badge ok">✓ En ligne</span>`:tropLourd(f)?`<span class="badge err" title="Maximum Flickr : ${taille(maxPour(f))}">Trop lourd · ${taille(f.taille)}</span>`:`<span class="coche" title="Inclure / exclure de l'envoi"></span>`}
        ${f.video?`<span class="badge">▶ Vidéo</span>`:""}
        <div class="nom">${esc(f.nom)}</div></div>`).join("")}</div>
    <div class="g-aide">${dispo?"Cliquez sur une image pour l'agrandir · la pastille ✓ inclut ou exclut le fichier · Maj+clic sur la pastille : toute une plage · ":"Cliquez sur une image pour l'agrandir · "}Échap : fermer</div>`;
  document.body.appendChild(g);
  const tuiles=[...g.querySelectorAll(".tuile")];
  function maj(){
    tuiles.forEach(t=>{const f=a.fichiers[+t.dataset.j]; if(!f.deja && !tropLourd(f)) t.classList.toggle("non",a.exclus.has(f.nom))});
    g.querySelector(".g-compte").textContent=`${aEnvoyer(a)} sur ${dispo} à envoyer`+(a.deja?` · ${a.deja} déjà en ligne`:"");
  }
  function basculer(j, exclure){
    const f=a.fichiers[j]; if(f.deja || tropLourd(f)) return;
    if(exclure===undefined) exclure=!a.exclus.has(f.nom);
    exclure ? a.exclus.add(f.nom) : a.exclus.delete(f.nom);
  }
  g.querySelector(".g-grille").addEventListener("click", e=>{
    const t=e.target.closest(".tuile"); if(!t) return;
    const j=+t.dataset.j;
    if(e.target.closest(".coche")){
      if(e.shiftKey && dernier!==null){
        const exclure=!a.exclus.has(a.fichiers[j].nom);   // l'état visé par ce clic
        for(let k=Math.min(dernier,j);k<=Math.max(dernier,j);k++) basculer(k,exclure);
      } else basculer(j);
      dernier=j; maj();
    } else loupe(j);
  });
  /* --- affichage en grand --- */
  let lp=null, courant=0;
  function loupe(j){
    courant=j; const f=a.fichiers[j];
    if(!lp){ lp=document.createElement("div"); lp.className="loupe"; document.body.appendChild(lp); }
    lp.innerHTML=`<div class="l-tete"><span>${esc(f.nom)} · ${j+1} / ${a.fichiers.length}</span>
        ${f.video?`<button data-l="lire">▶ Lire la vidéo</button>`:""}
        <button data-l="fermer">Fermer ✕</button></div>
      <div class="l-image"><span class="chargement">Chargement…</span>
        ${j>0?`<button class="nav prec" data-l="prec">‹</button>`:""}
        ${j<a.fichiers.length-1?`<button class="nav suiv" data-l="suiv">›</button>`:""}</div>
      <div class="l-pied">${f.deja?`<label>✓ Déjà en ligne sur Flickr</label>`:tropLourd(f)?
        `<label>⚠ Trop lourd pour Flickr : ${taille(f.taille)} (maximum ${taille(maxPour(f))})</label>`:
        `<label><input type="checkbox" ${a.exclus.has(f.nom)?"":"checked"}> Inclure dans l'envoi</label>`}</div>`;
    const cb=lp.querySelector("input[type=checkbox]");
    if(cb) cb.onchange=()=>{ basculer(j, !cb.checked); maj(); };
    lp.querySelector('[data-l="fermer"]').onclick=fermerLoupe;
    const pr=lp.querySelector('[data-l="prec"]'); if(pr) pr.onclick=()=>loupe(j-1);
    const sv=lp.querySelector('[data-l="suiv"]'); if(sv) sv.onclick=()=>loupe(j+1);
    const li=lp.querySelector('[data-l="lire"]'); if(li) li.onclick=()=>pywebview.api.ouvrir_fichier(f.chemin);
    lp.querySelector(".l-image").addEventListener("click", e=>{ if(e.target.classList.contains("l-image")) fermerLoupe(); });
    pywebview.api.apercu(f.chemin,1600).then(u=>{
      if(!lp || courant!==j) return;
      const zone=lp.querySelector(".l-image"), c=zone.querySelector(".chargement");
      if(!u){ c.textContent="Aperçu indisponible"; return; }
      const img=new Image(); img.src=u; c.replaceWith(img);
    });
  }
  function fermerLoupe(){ if(lp){ lp.remove(); lp=null; } }
  /* --- fermeture et clavier --- */
  function fermer(){ fermerLoupe(); g.remove(); document.removeEventListener("keydown",clavier); rendreListe(); resume(); }
  function clavier(e){
    if(lp){
      if(e.key==="Escape") fermerLoupe();
      else if(e.key==="ArrowLeft" && courant>0) loupe(courant-1);
      else if(e.key==="ArrowRight" && courant<a.fichiers.length-1) loupe(courant+1);
      else if(e.key===" "){ e.preventDefault(); const cb=lp.querySelector("input[type=checkbox]"); if(cb){ cb.checked=!cb.checked; cb.onchange(); } }
      return;
    }
    if(e.key==="Escape") fermer();
  }
  document.addEventListener("keydown",clavier);
  const bt=g.querySelector('[data-act="tout"]'); if(bt) bt.onclick=()=>{a.exclus.clear();maj()};
  const br=g.querySelector('[data-act="rien"]'); if(br) br.onclick=()=>{a.fichiers.forEach(f=>{if(!f.deja)a.exclus.add(f.nom)});maj()};
  g.querySelector('[data-act="ok"]').onclick=fermer;
  /* --- miniatures au format réel, chargées au fil du défilement --- */
  const obs=new IntersectionObserver(es=>es.forEach(en=>{ if(!en.isIntersecting) return;
      const t=en.target; obs.unobserve(t);
      chargerApercu(a.fichiers[+t.dataset.j].chemin, 400, u=>{
        if(!u || !t.isConnected) return;
        const img=new Image(); img.alt=""; img.onload=()=>{ const v=t.querySelector(".vide"); if(v) v.replaceWith(img); }; img.src=u;
      });
    }), {root:g.querySelector(".g-grille"), rootMargin:"400px"});
  tuiles.forEach(t=>obs.observe(t));
  maj();
}
function resume(){
  const inc=S.albums.filter(a=>a.inclus);
  const n=inc.reduce((s,a)=>s+aEnvoyer(a),0);
  $("#resume").textContent = `${inc.length} album${inc.length>1?"s":""} · ${n} fichier${n>1?"s":""} à envoyer`;
  if(S.termine){ $("#btnPublier").disabled=false; $("#btnPublier").textContent="Importer un nouvel album"; return; }
  $("#btnPublier").disabled = !inc.length || !S.moi || S.enCours;
  $("#btnPublier").textContent = S.moi ? "Publier" : "Connectez-vous d'abord";
}

/* ---------- publication ---------- */
let file=[];
$("#btnPublier").onclick=()=>{
  if(S.termine){ S.termine=false; ecranDepot(); return; }
  file = S.albums.map((a,i)=>({a,i})).filter(x=>x.a.inclus);
  if(!file.length) return;
  // contrôles : titre et date obligatoires, commune choisie dans la liste
  let erreurs=[];
  file.forEach(({a,i})=>{
    const c=$("#alb"+i);
    if(!a.titre.trim()){ c.querySelector(".titre").classList.add("invalide"); erreurs.push("titre"); }
    if(!a.date){ c.querySelector(".date").classList.add("invalide"); erreurs.push("date"); }
    const ic=c.querySelector(".commune");
    if(!a.commune && ic.value.trim()){ ic.classList.add("invalide"); erreurs.push("commune"); }
  });
  if(erreurs.length){
    const m={titre:"un titre",date:"une date",commune:"une commune choisie dans la liste"};
    toast("Il manque "+[...new Set(erreurs)].map(e=>m[e]).join(", ")+".");
    document.querySelector(".invalide")?.scrollIntoView({block:"center",behavior:"smooth"});
    return;
  }
  const albums = file.map(({a})=>({chemin:a.chemin, titre:a.titre, date:a.date, description:a.description,
      commune:a.commune, public:a.public, cible:cibleDe(a), exclus:[...a.exclus, ...a.fichiers.filter(tropLourd).map(f=>f.nom)],
      tags:[...S.commun, ...a.tags.filter(t=>!S.commun.some(c=>cle(c)===cle(t)))]}));
  S.enCours=true; resume(); $("#btnArret").style.display="";
  document.querySelectorAll("#liste input,#liste textarea,#liste button,#liste select").forEach(e=>e.disabled=true);
  file.forEach(({i})=>$("#alb"+i+" .suivi").innerHTML=`<div class="progres"><div></div></div><div class="statut">En attente…</div><div class="journal"></div>`);
  pywebview.api.publier(albums, S.analyse.racine);
};
$("#btnArret").onclick=()=>{pywebview.api.arreter(); $("#btnArret").textContent="Arrêt en cours…"};
function surProgres(ev){
  const {i}=file[ev.album]; const z=$("#alb"+i); if(!z) return;
  const st=z.querySelector(".statut"), bar=z.querySelector(".progres div"), j=z.querySelector(".journal");
  z.scrollIntoView({block:"nearest",behavior:"smooth"});
  if(ev.type==="debut") st.textContent="Préparation…";
  if(ev.type==="photo"){ bar.style.width=(100*(ev.i-1)/ev.n)+"%"; st.textContent=`Envoi ${ev.i}/${ev.n} — ${ev.fichier}` }
  if(ev.type==="info") st.textContent=ev.msg;
  if(ev.type==="erreur") j.innerHTML+=esc(ev.msg)+"<br>";
  if(ev.type==="fin"){ bar.style.width="100%";
    st.className="statut "+(ev.echecs.length?"err":"ok");
    st.innerHTML = (ev.erreur?`Erreur : ${esc(ev.erreur)}`:
      `✓ ${ev.envoyees} photo${ev.envoyees>1?"s":""} envoyée${ev.envoyees>1?"s":""}`+
      (ev.echecs.length?` · ${ev.echecs.length} échec(s) — relancez pour réessayer`:"")) +
      (ev.url?` · <button class="lien" data-u="${esc(ev.url)}">Voir l'album</button>`:"");
    const b=st.querySelector("[data-u]"); if(b) b.onclick=()=>pywebview.api.ouvrir(b.dataset.u);
  }
}
async function surTermine(res){
  const bilan=res.bilan;
  S.enCours=false; $("#btnArret").style.display="none"; $("#btnArret").textContent="Arrêter";
  const n=bilan.reduce((s,b)=>s+b.envoyees,0), e=bilan.reduce((s,b)=>s+b.echecs.length,0);
  toast(`Terminé : ${n} fichier${n>1?"s":""} envoyé${n>1?"s":""}`+(e?`, ${e} échec(s)`:""));
  S.termine = !e && bilan.length===file.length;   // tout est passé : on propose un nouvel import
  if(res.racine){ S.analyse.racine=res.racine; toast("Publié et rangé dans « Publiés » du dossier surveillé"); }
  // ré-analyse pour refléter l'état en ligne, en gardant les saisies
  const saisies = S.albums; const r = await pywebview.api.analyser(S.analyse.racine);
  S.analyse=r;
  S.albums = r.albums.map(a=>{const p=saisies.find(x=>x.relatif===a.relatif)||{};
    return {...a, inclus:p.inclus??true, tags:p.tags??[...a.tags], titre:p.titre??a.titre, date:p.date??a.date,
      description:p.description??a.description, commune:p.commune===undefined?a.commune:p.commune,
      public:p.public??S.etat.public_defaut, cible:null, exclus:p.exclus??new Set()}});
  const anciens=[...document.querySelectorAll(".suivi")].map(x=>x.innerHTML);
  rendreListe(); document.querySelectorAll(".suivi").forEach((x,k)=>x.innerHTML=anciens[k]||"");
  resume();
}

/* ---------- connexion / données du compte ---------- */
function connexion(){
  $("#compte").textContent="Connexion…"; $("#btnConnexion").style.display="none";
  pywebview.api.connecter();
}
function surConnexion(r){
  if(r.ok){ S.moi=r.moi; $("#pastille").classList.add("on"); $("#compte").textContent=r.moi.nom; }
  else { $("#compte").textContent="Non connecté"; $("#btnConnexion").style.display="";
         toast("Connexion impossible : "+r.erreur); }
  if(S.analyse) resume();
}
function surTags(t){
  t=t.map(x=>({...x, tag:String(x.tag), cle:String(x.cle)}));
  S.tags=t; S.index=new Map(t.map(x=>[x.cle,x]));
  document.querySelectorAll(".tags").forEach(c=>c._rendre&&c._rendre());
  document.querySelectorAll(".rapides").forEach(z=>z._maj&&z._maj());
}
function surAlbumsExistants(a){ S.albumsFlickr=a.map(x=>({id:String(x.id), titre:String(x.titre)})); if(S.analyse && !S.enCours) rendreListe(); }
function surErreur(m){ toast(m) }
$("#btnConnexion").onclick=connexion;
$("#btnReglages").onclick=()=>ecranCles(true);

/* survol visuel de la zone de dépôt (le dépôt lui-même est géré côté Python) */
document.addEventListener("dragenter",()=>{const z=$("#zone");if(z)z.classList.add("survol")});
document.addEventListener("dragleave",e=>{if(!e.relatedTarget){const z=$("#zone");if(z)z.classList.remove("survol")}});
document.addEventListener("drop",()=>{const z=$("#zone");if(z)z.classList.remove("survol")});

window.addEventListener("pywebviewready", async()=>{
  S.etat = await pywebview.api.etat();
  if(S.etat.version) document.title = "Publier sur Flickr " + S.etat.version,
    $("h1").insertAdjacentHTML("beforeend", ` <span style="font-weight:400;color:var(--doux);font-size:12px">v${esc(S.etat.version)}</span>`);
  if(!S.etat.cles) return ecranCles();
  ecranDepot(); connexion();
});
</script>

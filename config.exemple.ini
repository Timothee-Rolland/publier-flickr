[flickr]
# Clé et secret de l'application Flickr (https://www.flickr.com/services/apps/create/apply)
# NE JAMAIS les mettre dans ce dépôt : copier ce fichier en config.ini (ignoré par git).
api_key = COLLER_LA_CLE_ICI
api_secret = COLLER_LE_SECRET_ICI

[defaut]
# Tags proposés par défaut (modifiables à chaque envoi), séparés par des virgules
tags = EPY, Ensemble pour les Yvelines, Yvelines
# Description proposée par défaut
description =
# Choix proposé par défaut (1 = Public, 0 = Privé) ; il est redemandé à chaque envoi
public = 0
